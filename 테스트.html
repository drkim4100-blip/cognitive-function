<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 인사</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      font-size: 48px;
      text-align: center;
    }

    p {
      margin: 16px;
      font-size: 48px;
    }
  </style>
</head>
<body>
  <p>안녕하세요, 오늘도 반갑습니다</p>
  <p id="date"></p>

  <script>
    function updateDate() {
      const today = new Intl.DateTimeFormat("ko-KR", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }).format(new Date());

      document.getElementById("date").textContent = today;
    }

    updateDate();
    setInterval(updateDate, 60000);
  </script>
</body>
</html>
